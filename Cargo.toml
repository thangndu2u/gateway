[package]
name = "gateway"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "admin"
path = "src/main.rs"

[dependencies]
actix = "0.13.5"
actix-web = "4.3.1"
static_init = "1.0.3"

tokio = { version = "1.32.0", features = ["full"] }
tokio-cron-scheduler = "0.14.0"
actix-cors = "0.6.4"
actix-web-prom = "0.8.0"
actix-service = "2.0.2"
jsonwebtoken = "9.2.0"

serde = { version = "1.0.183", features = ["derive"] }
serde_json = "1.0.105"

dotenv = "0.15.0"
tracing = "0.1.41"
uuid = { version = "1.4", features = ["v4", "serde"] }
once_cell = "1.19.0"
dashmap = "6.0.1"
serde_yaml = "0.9.25"
async-trait = "0.1.73"
env_logger = "0.11.8"
anyhow = "1.0.98"

sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-native-tls",
    "macros",
    "postgres",
    "bigdecimal",
    "chrono",
    "json",
    "migrate",
    "ipnetwork",
] }

utoipa = { version = "4.1.0", features = ["actix_extras"] }

reqwest = { version = "0.11.18", features = ["json", "native-tls-crate"] }
futures-util = "0.3.31"
futures = "0.3.31"
